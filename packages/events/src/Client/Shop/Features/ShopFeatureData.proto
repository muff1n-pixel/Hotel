syntax = "proto3";

import "Client/Shop/Features/ShopFeaturePageData.proto";
import "Client/Shop/Features/Configuration/ShopFeatureConfigurationData.proto";

message ShopFeatureData {
    string id = 1;

    string title = 2;
    string image = 3;

    ShopFeaturePageData featured_page = 5;

    optional ShopFeatureConfigurationData configuration = 6;
}
