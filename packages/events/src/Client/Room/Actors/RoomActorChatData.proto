syntax = "proto3";

import "Client/Room/Actors/RoomActorIdentifierData.proto";
import "Client/Room/Actors/Chat/RoomActorChatOptionsData.proto";

message RoomActorChatData {
    RoomActorIdentifierData actor = 1;

    optional RoomActorChatOptionsData options = 3;
    string room_chat_style_id = 4;

    string message = 2;
    repeated string message_vocals = 5;
    optional uint32 message_vocal_index = 6;
}
