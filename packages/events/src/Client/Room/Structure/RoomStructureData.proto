syntax = "proto3";

import "Client/Room/Structure/RoomStructureDoorData.proto";
import "Client/Room/Structure/RoomStructureWallData.proto";
import "Client/Room/Structure/RoomStructureFloorData.proto";
import "Client/Room/Structure/RoomStructureLandscapeData.proto";

message RoomStructureData {
    repeated string grid = 1;
    
    RoomStructureDoorData door = 2;
    RoomStructureWallData wall = 3;
    RoomStructureFloorData floor = 4;
    RoomStructureLandscapeData landscape = 5;
}
