syntax = "proto3";

import "Client/User/UserIdentifierData.proto";
import "Client/Bot/BotIdentifierData.proto";
import "Client/Pets/PetIdentifierData.proto";

message RoomActorIdentifierData {
    oneof actor {
        UserIdentifierData user = 1;
        BotIdentifierData bot = 2;
        PetIdentifierData pet = 3;
    }
}
