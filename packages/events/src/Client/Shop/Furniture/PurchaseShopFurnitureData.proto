syntax = "proto3";

import "Client/Room/RoomPositionData.proto";
import "Client/User/Furniture/UserFurnitureCustomData.proto";
import "Client/Shop/Gifts/PurchaseShopGiftData.proto";

message PurchaseShopFurnitureData {
    string id = 1;
    optional UserFurnitureCustomData data = 2;

    optional RoomPositionData position = 3;
    optional uint32 direction = 4;

    optional uint32 quantity = 5;

    optional string group_id = 6;

    optional PurchaseShopGiftData gift = 7;
}
