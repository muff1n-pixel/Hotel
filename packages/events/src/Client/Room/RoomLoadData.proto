syntax = "proto3";

import "Client/Room/Information/RoomInformationData.proto";
import "Client/Room/Configuration/RoomClickConfigurationData.proto";

import "Client/Room/Users/RoomUserData.proto";

import "Client/Room/Structure/RoomStructureData.proto";

import "Client/Furniture/FurnitureData.proto";
import "Client/User/Furniture/UserFurnitureData.proto";

import "Client/User/Bots/UserBotData.proto";
import "Client/User/Pets/UserPetData.proto";

message RoomLoadData {
    string id = 1;

    RoomInformationData information = 2;

    RoomStructureData structure = 3;
    RoomClickConfigurationData click_configuration = 10;

    repeated UserFurnitureData furniture = 5;
    repeated FurnitureData furniture_data = 9;

    repeated RoomUserData users = 4;
    repeated UserBotData bots = 6;
    repeated UserPetData pets = 7;

    bool has_rights = 8;
}
