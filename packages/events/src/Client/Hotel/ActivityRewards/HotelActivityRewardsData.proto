syntax = "proto3";

message HotelActivityRewardData {
    string id = 1;

    uint32 interval = 2;

    optional uint32 credits = 3;
    optional uint32 duckets = 4;
    optional uint32 diamonds = 5;
}

message HotelActivityRewardsData {
    repeated HotelActivityRewardData activity_rewards = 1; 
}
