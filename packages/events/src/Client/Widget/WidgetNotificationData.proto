syntax = "proto3";

import "Client/Badge/BadgeData.proto";
import "Client/Furniture/FurnitureData.proto";
import "Client/Figure/FigureConfigurationData.proto";

message WidgetNotificationData {
    string id = 1;

    string text = 2;

    optional BadgeData badge = 3;
    optional string image_url = 4;
    optional FurnitureData furniture = 5;
    optional FigureConfigurationData figure_configuration = 6;
}
