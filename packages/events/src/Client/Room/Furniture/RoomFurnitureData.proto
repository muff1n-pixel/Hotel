syntax = "proto3";

import "Client/Furniture/FurnitureData.proto";
import "Client/User/Furniture/UserFurnitureData.proto";
import "Client/Room/Furniture/RoomFurnitureUpdateData.proto";

message RoomFurnitureData {
    repeated FurnitureData furniture_data = 4;

    repeated UserFurnitureData furniture_added = 1;
    repeated RoomFurnitureUpdateData furniture_updated = 2;
    repeated UserFurnitureData furniture_removed = 3;

    optional bool hide_flying_furniture = 5;
}
