syntax = "proto3";

import "Client/Room/RoomPositionData.proto";
import "Client/Pets/PetData.proto";

message UserPetData {
    string id = 1;
    string user_id = 2;
    string user_name = 3;
    
    string name = 4;
    PetData pet = 5;

    RoomPositionData position = 6;
    uint32 direction = 7;

    uint32 scratches = 8;

    uint32 level = 9;

    uint32 experience = 10;
    uint32 max_experience = 11;

    uint32 happiness = 12;
    uint32 max_happiness = 13;

    uint32 energy = 14;
    uint32 max_energy = 15;

    uint32 days = 16;
}
