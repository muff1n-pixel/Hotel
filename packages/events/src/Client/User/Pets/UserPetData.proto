syntax = "proto3";

import "Client/Room/RoomPositionData.proto";
import "Client/Pets/PetData.proto";

message UserPetData {
    string id = 1;
    string user_id = 2;
    
    string name = 4;
    PetData pet = 5;

    RoomPositionData position = 6;
    uint32 direction = 7;

    uint32 scratches = 8;

    uint32 level = 9;
    uint32 experience_points = 10;
    uint32 happiness = 11;
    uint32 energy = 12;
}
