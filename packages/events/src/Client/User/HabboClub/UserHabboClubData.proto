syntax = "proto3";

import "Client/Badge/BadgeData.proto";

message UserHabboClubData {
    bool active = 1;
    uint32 membership_days = 3;
    uint32 membership_streak = 5;

    optional string member_since = 2;
    optional string expires_at = 4;

    optional BadgeData badge = 6;

    uint32 cashback = 7;
    uint32 gifts = 8;
}
