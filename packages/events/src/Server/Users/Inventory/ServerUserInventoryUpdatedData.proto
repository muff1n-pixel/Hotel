syntax = "proto3";

message ServerUserInventoryUpdatedData {
    string user_id = 1;

    repeated string furniture_added = 2;
    repeated string furniture_removed = 3;
    
    repeated string pets_added = 4;
    repeated string pets_removed = 5;
    
    repeated string bots_added = 6;
    repeated string bots_removed = 7;
}